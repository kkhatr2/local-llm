apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-llm.fullname" . }}
  labels:
    {{- include "local-llm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "local-llm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
