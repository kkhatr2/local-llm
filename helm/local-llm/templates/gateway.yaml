{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "local-llm.fullname" . }}-public
  labels:
    {{- include "local-llm.labels" . | nindent 4 }}
  annotations:
    local-llm.io/min-tls-version: "1.2"
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.certificateSecretRef }}
        options:
          local-llm.io/min-tls-version: "1.2"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: local-llm.io/v1alpha1
kind: APIKeyPolicy
metadata:
  name: {{ include "local-llm.fullname" . }}-api-key
  labels:
    {{- include "local-llm.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "local-llm.fullname" . }}-public
  apiKeySecretRef:
    name: {{ .Values.gateway.apiKeySecretRef }}
  header: {{ .Values.gateway.apiKeyHeader }}
  missingKeyStatus: 401
  invalidKeyStatus: 401
  forwardKeyValue: false
  audit:
    maskKeyIdentity: true
    includeAlias: true
    includeStatus: true
    includeRequestId: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "local-llm.fullname" . }}-http-redirect
  labels:
    {{- include "local-llm.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "local-llm.fullname" . }}-public
      sectionName: http
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "local-llm.fullname" . }}-public-api
  labels:
    {{- include "local-llm.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "local-llm.fullname" . }}-public
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /health
      filters:
        - type: ExtensionRef
          extensionRef:
            group: local-llm.io
            kind: APIKeyPolicy
            name: {{ include "local-llm.fullname" . }}-api-key
      backendRefs:
        - name: {{ include "local-llm.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.allowedAliasPrefix }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: local-llm.io
            kind: APIKeyPolicy
            name: {{ include "local-llm.fullname" . }}-api-key
      backendRefs:
        - name: {{ include "local-llm.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
