x-phase2-image-digests:
  # Keep in sync with deploy/image-digests.yaml. Local Compose still builds
  # from source; the digest pins are consumed by cloud promotion tooling.
  cpu: &cpu_image_digest "repository/local-llm-api@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  cuda: &cuda_image_digest "repository/local-llm-api-cuda@sha256:2222222222222222222222222222222222222222222222222222222222222222"

services:
  api:
    build: .
    platform: linux/amd64
    profiles: ["serve"]
    command: >-
      uvicorn local_llm.api:app
      --host 0.0.0.0
      --port 8000
    working_dir: /app
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./private.txt
        required: false
    environment:
      LOCAL_LLM_CONFIG: /app/local_llm.yaml
      PYTHONPATH: /app
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./models:/app/models
      - ./.cache:/app/.cache
      - ./local_llm.yaml:/app/local_llm.yaml:ro

  tests:
    build: .
    platform: linux/amd64
    working_dir: /app
    init: true
    command: python -m unittest discover -s tests -v
    env_file:
      - path: ./private.txt
        required: false
    environment:
      LOCAL_LLM_CONFIG: /app/local_llm.yaml
      PYTHONPATH: /app
    volumes:
      - ./local_llm.yaml:/app/local_llm.yaml:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./environment.yaml:/app/environment.yaml:ro
      - ./environment-linux-64.lock:/app/environment-linux-64.lock:ro
      - ./opencode.jsonc:/app/opencode.jsonc:ro
      - ./local_llm:/app/local_llm
      - ./tests:/app/tests
      - .:/workspace:ro

  dev:
    build: .
    platform: linux/amd64
    working_dir: /app
    init: true
    stdin_open: true
    tty: true
    command: bash
    env_file:
      - path: ./private.txt
        required: false
    environment:
      LOCAL_LLM_CONFIG: /app/local_llm.yaml
      PYTHONPATH: /app
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./models:/app/models
      - ./.cache:/app/.cache
      - ./local_llm.yaml:/app/local_llm.yaml:ro
      - .:/workspace
